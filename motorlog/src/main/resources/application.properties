spring.application.name=motorlog
# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/motorlog_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Magia de Spring Boot (Crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
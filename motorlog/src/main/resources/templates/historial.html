<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial - MotorLog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; }
        .navbar { background-color: #333; color: white; padding: 15px 20px; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, input[type="date"] { padding: 8px; margin: 5px 0; width: 90%; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        .btn-volver { background-color: #6c757d; text-decoration: none; padding: 10px 15px; color: white; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>MotorLog ⚙️🚗</h2>
    </div>
    
    <div class="container">
        <a th:href="@{/garaje}" class="btn-volver">← Volver al Garaje</a>

        <div class="card">
            <h2>Historial de: <span th:text="${vehiculo.marca} + ' ' + ${vehiculo.modelo}"></span></h2>
            <p><strong>Matrícula:</strong> <span th:text="${vehiculo.matricula}"></span></p>
        </div>

        <!-- Formulario para nueva intervención (HU 2.1) -->
        <div class="card">
            <h3>+ Añadir Intervención</h3>
            <form th:action="@{/guardarIntervencion/{vehiculoId}(vehiculoId=${vehiculo.id})}" th:object="${nuevaIntervencion}" method="post">
                <input type="date" th:field="*{fecha}" required>
                <input type="text" th:field="*{descripcion}" placeholder="Descripción (Ej. Cambio de aceite, ruedas...)" required>
                <input type="number" step="0.01" th:field="*{coste}" placeholder="Coste total (€)" required>
                <button type="submit">Guardar Mantenimiento</button>
            </form>
        </div>

        <!-- Lista de intervenciones (HU 2.2) -->
        <div class="card">
            <h3>Mantenimientos Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Coste</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inter : ${intervenciones}">
                        <td th:text="${inter.fecha}"></td>
                        <td th:text="${inter.descripcion}"></td>
                        <td th:text="${inter.coste} + ' €'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(intervenciones)}">
                        <td colspan="3">Aún no hay intervenciones registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial - MotorLog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #0d1117;
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            
            /* Paleta Pastel */
            --pastel-green-bg: #86efac;
            --pastel-green-text: #064e3b;
            
            --pastel-purple-bg: #c084fc;
            --pastel-purple-text: #3b0764;
            
            --pastel-slate-bg: #cbd5e1;
            --pastel-slate-text: #0f172a;
            
            --pastel-red-bg: #fca5a5;
            --pastel-red-text: #881337;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding-bottom: 40px;
        }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .navbar h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        /* BOTONES PÍLDORA PASTEL */
        .btn {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-volver {
            background-color: var(--pastel-slate-bg);
            color: var(--pastel-slate-text);
            margin-bottom: 20px;
        }

        .btn-submit {
            background-color: var(--pastel-purple-bg);
            color: var(--pastel-purple-text);
        }

        .btn-borrar {
            background-color: var(--pastel-red-bg);
            color: var(--pastel-red-text);
            padding: 4px 12px;
            font-size: 0.8rem;
        }

        /* Tabla de Mantenimientos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>MotorLog ⚙️🚗</h2>
    </div>

    <div class="container">
        <!-- Botón Volver Pastel Píldora -->
        <a th:href="@{/garaje}" class="btn btn-volver">← Volver al Garaje</a>

        <!-- Información del Coche -->
        <div class="card">
            <h2 style="margin-top:0;" th:text="${vehiculo.marca} + ' ' + ${vehiculo.modelo}"></h2>
            <p><strong>Matrícula:</strong> <span th:text="${vehiculo.matricula}"></span> | <strong>Kilómetros:</strong> <span th:text="${vehiculo.kilometros}"></span> km</p>
        </div>

        <!-- Formulario HU 2.1 -->
        <div class="card">
            <h3>+ Añadir Intervención</h3>
            <form th:action="@{/guardarIntervencion/{vehiculoId}(vehiculoId=${vehiculo.id})}" th:object="${nuevaIntervencion}" method="post">
                <label style="color: var(--text-secondary); font-size: 0.85rem;">Fecha:</label>
                <input type="date" th:field="*{fecha}" required>
                
                <label style="color: var(--text-secondary); font-size: 0.85rem;">Descripción:</label>
                <input type="text" th:field="*{descripcion}" placeholder="Ej. Cambio de aceite y filtros" required>
                
                <label style="color: var(--text-secondary); font-size: 0.85rem;">Coste (€):</label>
                <input type="number" step="0.01" th:field="*{coste}" placeholder="0.00" required>
                
                <button type="submit" class="btn btn-submit">Guardar Mantenimiento</button>
            </form>
        </div>

        <!-- Historial HU 2.2 & HU 3.3 -->
        <div class="card">
            <h3>Mantenimientos Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Coste</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inter : ${intervenciones}">
                        <td th:text="${inter.fecha}"></td>
                        <td th:text="${inter.descripcion}"></td>
                        <td th:text="${inter.coste} + ' €'"></td>
                        <td>
                            <a th:href="@{/intervencion/borrar/{id}/{vehiculoId}(id=${inter.id}, vehiculoId=${vehiculo.id})}" class="btn btn-borrar" onclick="return confirm('¿Borrar esta intervención?');">Borrar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(intervenciones)}">
                        <td colspan="4" style="color: var(--text-secondary); text-align: center;">Aún no hay intervenciones registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Garaje - MotorLog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #0d1117;
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            
            /* Paleta Pastel */
            --pastel-green-bg: #86efac;
            --pastel-green-text: #064e3b;
            
            --pastel-yellow-bg: #fde047;
            --pastel-yellow-text: #713f12;
            
            --pastel-red-bg: #fca5a5;
            --pastel-red-text: #881337;
            
            --pastel-purple-bg: #c084fc;
            --pastel-purple-text: #3b0764;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding-bottom: 40px;
        }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .navbar h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        .btn {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-submit {
            background-color: var(--pastel-purple-bg);
            color: var(--pastel-purple-text);
        }

        .btn-historial {
            background-color: var(--pastel-green-bg);
            color: var(--pastel-green-text);
        }

        .btn-editar {
            background-color: var(--pastel-yellow-bg);
            color: var(--pastel-yellow-text);
        }

        .btn-borrar {
            background-color: var(--pastel-red-bg);
            color: var(--pastel-red-text);
        }

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>MotorLog ⚙️🚗</h2>
    </div>

    <div class="container">
        <!-- Formulario de Registro -->
        <div class="card">
            <h3>+ Registrar Nuevo Vehículo</h3>
            <form th:action="@{/guardarVehiculo}" th:object="${nuevoVehiculo}" method="post">
                <input type="text" th:field="*{marca}" placeholder="Marca (Ej. Fiat)" required>
                <input type="text" th:field="*{modelo}" placeholder="Modelo (Ej. Grande Punto)" required>
                <input type="text" th:field="*{matricula}" placeholder="Matrícula" required>
                <input type="number" th:field="*{kilometros}" placeholder="Kilómetros" required>
                <button type="submit" class="btn btn-submit">Guardar Vehículo</button>
            </form>
        </div>


        <div class="card">
            <h3>Vehículos en el Garaje</h3>
            
            <div th:each="coche : ${vehiculos}" class="card" style="margin-bottom: 16px; background: rgba(255,255,255,0.02);">
                <h3 th:text="${coche.marca} + ' ' + ${coche.modelo}" style="margin-top:0;"></h3>
                <p><strong>Matrícula:</strong> <span th:text="${coche.matricula}"></span></p>
                <p><strong>Kilómetros:</strong> <span th:text="${coche.kilometros}"></span> km</p>
                

                <div class="acciones">
                    <a th:href="@{/vehiculo/{id}(id=${coche.id})}" class="btn btn-historial">Ver Historial</a>
                    <a th:href="@{/vehiculo/editar/{id}(id=${coche.id})}" class="btn btn-editar">Editar</a>
                    <a th:href="@{/vehiculo/borrar/{id}(id=${coche.id})}" class="btn btn-borrar" onclick="return confirm('¿Seguro que quieres borrar este vehículo y todo su historial?');">Borrar</a>
                </div>
            </div>

            <p th:if="${#lists.isEmpty(vehiculos)}" style="color: var(--text-secondary);">No hay vehículos registrados en el garaje.</p>
        </div>
    </div>
</body>
</html>

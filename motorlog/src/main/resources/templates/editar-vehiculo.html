<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Vehículo - MotorLog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --input-bg: #0d1117;
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            
            /* Paleta Pastel */
            --pastel-yellow-bg: #fde047;
            --pastel-yellow-text: #713f12;
            
            --pastel-slate-bg: #cbd5e1;
            --pastel-slate-text: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding-bottom: 40px;
        }

        .navbar {
            background: #161b22;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .navbar h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: #58a6ff;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* BOTONES PÍLDORA PASTEL */
        .btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-guardar {
            background-color: var(--pastel-yellow-bg);
            color: var(--pastel-yellow-text);
        }

        .btn-cancelar {
            background-color: var(--pastel-slate-bg);
            color: var(--pastel-slate-text);
        }

        .acciones {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>MotorLog ⚙️🚗</h2>
    </div>

    <div class="container">
        <div class="card">
            <h2 style="margin-top:0;">Editar Vehículo</h2>
            <form th:action="@{/vehiculo/actualizar}" th:object="${vehiculo}" method="post">
                <!-- ID oculta obligatoria para update -->
                <input type="hidden" th:field="*{id}" />

                <label>Marca:</label>
                <input type="text" th:field="*{marca}" required />

                <label>Modelo:</label>
                <input type="text" th:field="*{modelo}" required />

                <label>Matrícula:</label>
                <input type="text" th:field="*{matricula}" required />

                <label>Kilómetros:</label>
                <input type="number" th:field="*{kilometros}" required />

                <div class="acciones">
                    <button type="submit" class="btn btn-guardar">Guardar Cambios</button>
                    <a th:href="@{/garaje}" class="btn btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
